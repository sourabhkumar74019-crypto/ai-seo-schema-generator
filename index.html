<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SEO & Schema Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 md:p-8 font-sans transition-colors duration-300">

    <div class="max-w-3xl mx-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-xl dark:shadow-2xl transition-colors duration-300">
        
        <!-- Top Bar with Light/Dark Mode Toggle -->
        <div class="flex justify-between items-center mb-6">
            <span class="text-xs font-bold tracking-widest text-indigo-600 dark:text-indigo-400 uppercase">Micro-SaaS Tool #2</span>
            <button onclick="toggleTheme()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                <span id="themeIcon">☀️ Light Mode</span>
            </button>
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-indigo-600 dark:from-purple-400 dark:to-indigo-400">
                AI SEO & Schema Generator
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Generate Meta Tags, Descriptions & Structured JSON-LD Schema instantly</p>
        </div>

        <!-- Form Inputs -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your Gemini API Key" 
                    class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-white transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Page Title / Topic</label>
                    <input type="text" id="pageTitle" placeholder="e.g. Best Running Shoes for Men in 2026" 
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Target Keywords</label>
                    <input type="text" id="keywords" placeholder="e.g. running shoes, sports footwear, marathon" 
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Page Summary / Content Description</label>
                <textarea id="pageSummary" rows="3" placeholder="Briefly describe what this page or article is about..." 
                    class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-900 dark:text-white transition"></textarea>
            </div>

            <button onclick="generateSEO()" id="btnText"
                class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 font-bold py-3 rounded-lg shadow-lg transition duration-200 text-white">
                🚀 Generate SEO & Schema Package
            </button>
        </div>

        <!-- Output Box -->
        <div id="outputContainer" class="mt-8 hidden">
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-200 mb-2">Generated SEO Package:</h2>
            <div id="output" class="bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-4 text-slate-800 dark:text-slate-300 whitespace-pre-wrap text-sm leading-relaxed font-mono transition"></div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Light / Dark Theme Toggle Function
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = '🌙 Dark Mode';
            } else {
                html.classList.add('dark');
                icon.innerText = '☀️ Light Mode';
            }
        }

        // Gemini API Logic
        async function generateSEO() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const title = document.getElementById('pageTitle').value.trim();
            const keywords = document.getElementById('keywords').value.trim();
            const summary = document.getElementById('pageSummary').value.trim();
            const btn = document.getElementById('btnText');
            const outputContainer = document.getElementById('outputContainer');
            const output = document.getElementById('output');

            if (!apiKey || !title || !summary) {
                alert('Please fill in required fields and enter your Gemini API Key.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Generating SEO Tags... ⏳';
            outputContainer.classList.remove('hidden');
            output.innerText = 'Analyzing content with AI...';

            const promptText = `Act as a Senior SEO Specialist. Generate a complete SEO package for:
            - Page Title/Topic: ${title}
            - Target Keywords: ${keywords}
            - Summary: ${summary}

            Provide output in clean sections:
            1. Optimized Meta Title (under 60 chars)
            2. High-CTR Meta Description (under 160 chars)
            3. OpenGraph / Social Media Tags
            4. JSON-LD Article/Product Schema Markup Code Snippet`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    output.innerText = 'API Error: ' + data.error.message;
                } else {
                    output.innerText = 'Failed to generate response. Check your API Key.';
                }
            } catch (err) {
                output.innerText = 'Error connecting to Gemini API: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = '🚀 Generate SEO & Schema Package';
            }
        }
    </script>
</body>
</html>
